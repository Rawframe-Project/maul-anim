# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@bf59dbcd696369b51a9831145fb3b60f3bc71280 # v0.0.26
    permissions:
      pull-requests: read
    with:
      scopes: math skeleton pose clip compress blend rootmotion graph match learned ik spring ragdoll retarget mirror skin morph format import gltf fbx build bench tools family
