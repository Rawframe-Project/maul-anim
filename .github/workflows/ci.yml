# Continuous integration for Maul Anim.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # apt retries a stalled download and gives up on a dead one.
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30
  PREFIX: MAUL_ANIM

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/gen_math_constants.py --check
          python3 tools/check_guide.py
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_ANIM_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_ANIM_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04,     cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_ANIM_BUILD_SHARED=ON" }
          - { name: linux-arm64-gcc-14,  os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: macos-clang,         os: macos-15,         cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends, with the sanitizers' runtime.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q gcc-14 g++-14 ninja-build
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      - name: Package
        if: matrix.name == 'linux-shared'
        run: cmake --install build --prefix "$PWD/package"

  # The API reference is generated from the headers; it must match them,
  # and the README must give its function count.
  docs:
    name: generated docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The API reference matches the headers
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }

  # The runtime's text by part at -O2 and -O3 (GCC 14), reported against
  # tools/size-budget.txt (record 0013: checked at release, mani-0036),
  # and the runtime's allocator symbols, which must be none.
  size:
    name: size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q gcc-14 ninja-build
      - name: Runtime builds
        run: |
          for level in O2 O3; do
            cmake -B build-$level -G Ninja -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_C_FLAGS_RELEASE=-$level -DNDEBUG" -DMAUL_ANIM_OFFLINE=OFF \
              -DMAUL_ANIM_BUILD_TESTS=OFF -DMAUL_ANIM_BUILD_BENCH=OFF
            cmake --build build-$level -j 4
          done
      - name: Text by part
        run: |
          for level in O2 O3; do
            echo "== -$level"
            python3 tools/size_report.py build-$level/libmaul-anim.a
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        # A skipped test fails the step, as it would hide a broken job.
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          for t in build/test_*.js; do node "$t" || exit 1; done
      - name: Size
        # The static library's size, reported, not gated (family record
        # 0013).
        run: stat -c '%s bytes' build/libmaul-anim.a

  # Each fuzz target runs for one minute on every push, from its seed:
  # the skeleton, skin and clip loaders (full and compressed clips), the
  # graph files and their JSON form, learned models and training
  # checkpoints, the JSON reader and the glTF and FBX
  # documents from their tests' sample files (with the fixtures of
  # test/data/gltf and test/data/fbx).
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 \
            libclang-rt-20-dev ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          mkdir -p corpus-fuzz_skeleton
          build/test_skeleton --seed corpus-fuzz_skeleton/sample.skeleton
          mkdir -p corpus-fuzz_skin
          build/test_skin --seed corpus-fuzz_skin/sample.skin
          mkdir -p corpus-fuzz_influences
          build/test_influences --seed corpus-fuzz_influences/sample.influences
          mkdir -p corpus-fuzz_morph
          build/test_morph --seed corpus-fuzz_morph/sample.morph
          mkdir -p corpus-fuzz_clip
          build/test_clip --seed corpus-fuzz_clip/sample.clip
          build/test_clip_compress --seed corpus-fuzz_clip/compressed.clip
          build/test_root_motion --seed corpus-fuzz_clip/root.clip
          mkdir -p corpus-fuzz_graph
          build/test_graph --seed corpus-fuzz_graph/sample.graph
          mkdir -p corpus-fuzz_graph_json
          build/test_graph_json --seed corpus-fuzz_graph_json/sample.json
          build/test_graph_space --seed corpus-fuzz_graph/space.graph corpus-fuzz_graph_json/space.json
          build/test_graph_triangles --seed corpus-fuzz_graph/triangles.graph corpus-fuzz_graph_json/triangles.json
          build/test_graph_machine --seed corpus-fuzz_graph/machine.graph corpus-fuzz_graph_json/machine.json
          build/test_graph_listen --seed corpus-fuzz_graph/listen.graph corpus-fuzz_graph_json/listen.json
          build/test_graph_shot --seed corpus-fuzz_graph/shot.graph corpus-fuzz_graph_json/shot.json
          build/test_graph_inertia --seed corpus-fuzz_graph/inertia.graph corpus-fuzz_graph_json/inertia.json
          build/test_graph_match_file --seed corpus-fuzz_graph/match.graph corpus-fuzz_graph_json/match.json
          build/test_graph_learned_file --seed corpus-fuzz_graph/learned.graph corpus-fuzz_graph_json/learned.json
          build/test_graph_spring_node --seed corpus-fuzz_graph/spring.graph corpus-fuzz_graph_json/spring.json
          build/test_graph_nested --seed corpus-fuzz_graph/nested.graph corpus-fuzz_graph_json/nested.json
          build/test_graph_ik_node --seed corpus-fuzz_graph/ik.graph corpus-fuzz_graph_json/ik.json
          build/test_graph_chain_node --seed corpus-fuzz_graph/chain.graph corpus-fuzz_graph_json/chain.json
          build/test_graph_body_node --seed corpus-fuzz_graph/body.graph corpus-fuzz_graph_json/body.json
          mkdir -p corpus-fuzz_match
          build/test_match --seed corpus-fuzz_match/sample.match
          mkdir -p corpus-fuzz_learned
          build/test_learned --seed corpus-fuzz_learned/sample.model
          mkdir -p corpus-fuzz_spring
          build/test_spring --seed corpus-fuzz_spring/sample.spring
          mkdir -p corpus-fuzz_ragdoll
          build/test_ragdoll --seed corpus-fuzz_ragdoll/sample.ragdoll
          mkdir -p corpus-fuzz_retarget
          build/test_retarget_map --seed corpus-fuzz_retarget/sample.retarget
          mkdir -p corpus-fuzz_mirror
          build/test_mirror_map --seed corpus-fuzz_mirror/sample.mirror
          mkdir -p corpus-fuzz_map_json
          build/test_retarget_json --seed corpus-fuzz_map_json/retarget.json
          build/test_mirror_json --seed corpus-fuzz_map_json/mirror.json
          mkdir -p corpus-fuzz_checkpoint
          build/test_learned_train --seed corpus-fuzz_checkpoint/sample.ckpt
          mkdir -p corpus-fuzz_json
          build/test_json --seed corpus-fuzz_json/sample.json
          mkdir -p corpus-fuzz_gltf
          build/test_gltf --seed corpus-fuzz_gltf/sample.glb
          build/test_gltf_spring_extensions --seed corpus-fuzz_gltf/springs.gltf
          build/test_gltf_ragdoll --seed corpus-fuzz_gltf/ragdoll.gltf
          cp test/data/gltf/*.glb test/data/gltf/*.gltf corpus-fuzz_gltf/
          mkdir -p corpus-fuzz_fbx
          build/test_fbx --seed corpus-fuzz_fbx/sample.fbx
          cp test/data/fbx/*.fbx corpus-fuzz_fbx/
          for target in build/fuzz_*; do
            name=$(basename $target)
            mkdir -p "corpus-$name"
            if [ -f "test/corpus/$name.tar.gz" ]; then
              tar -xzf "test/corpus/$name.tar.gz" -C "corpus-$name"
            fi
            "$target" -max_total_time=60 "corpus-$name"
          done
