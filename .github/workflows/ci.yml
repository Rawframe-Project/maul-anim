# Continuous integration: the pull request check, and the full check on
# main, which fuzzes longer. Each build cell is a CMake preset built by
# the organization's shared workflow; the other jobs run in the same CI
# image where they can. The differentials and the long fuzzing run in
# nightly.yml. docs/operations/checks.md explains each job, and
# tools/check.sh runs the same presets locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_ANIM

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@b1220ae4523884c7baee93dfb2d9dd1fb1ec960b # v0.0.9
    permissions:
      pull-requests: read

  # The organization's documentation check; test/data holds other
  # projects' sample files with their own READMEs, kept as published.
  docs:
    uses: Rawframe-Project/.github/.github/workflows/docs-check.yml@b1220ae4523884c7baee93dfb2d9dd1fb1ec960b # v0.0.9
    permissions:
      contents: read
    with:
      exclude: test/data

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@b1220ae4523884c7baee93dfb2d9dd1fb1ec960b # v0.0.9
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the generated sources
  # and test tables against their generators, the documentation site, and
  # clang-tidy. It runs on documentation changes too, since the snippet
  # check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.5@sha256:bc8ecad77f13664efd2c5961f3c82751d45b3c0b05fb3ccaaea9d0bdd0966f60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          mapfile -t files < <(git ls-files 'include/*.h' 'src/*.[ch]' 'test/*.[ch]' 'tools/*.[ch]' 'bench/*.[ch]')
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no C file found"; exit 1; fi
          clang-format --dry-run -Werror "${files[@]}"
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: Generated files match their generators
        run: |
          for generator in gen_math_constants gen_decimal_powers gen_inflate_tables gen_number_cases \
            gen_format_cases gen_gltf_expect; do
            python3 "tools/$generator.py" --check
          done
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # Four files at a time, one per core of the runner.
        run: |
          cmake -B out/tidy -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF
          mapfile -t files < <(git ls-files 'src/*.c')
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no source file found"; exit 1; fi
          printf '%s\n' "${files[@]}" | xargs -P 4 -n 4 clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*'

  # Every cell builds with warnings as errors and runs the whole suite, the
  # header tests included. linux-gcc-14 builds every part with GCC 14, as
  # CodeQL does; the GCC and Clang Release cells also run an import under a
  # memory limit; linux-shared installs the library and builds test/consumer
  # against it (the "package" test).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-arm64-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@b1220ae4523884c7baee93dfb2d9dd1fb1ec960b # v0.0.9
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # Windows beyond the static cell: the public headers alone under MSVC's
  # cl, as C17 and C++17 with /W4 /WX (consumers may compile them with it,
  # though it cannot build the library); the runtime's allocator symbols
  # under clang-cl, which must be none; and the DLL through its installed
  # package alone, the CPU check's functions exported and the backend named.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release
      - name: Runtime allocators
        run: |
          cmake --preset windows-runtime
          cmake --build --preset windows-runtime
          NM=llvm-nm python tools/size_report.py out/windows-runtime/Release/maul-anim.lib --allocators
      - name: Package consumer, DLL
        run: |
          cmake --preset windows-shared
          cmake --build --preset windows-shared --target maul-anim
          ctest --preset windows-shared -L '^package$' | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows
          path: out/windows-shared/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The runtime's text by part at -O2 and -O3 (GCC 14), on the scalar
  # backend and on AVX2, held against tools/size-budget.txt, and its
  # allocator symbols, which must be none: for GCC 14 at both levels and
  # for Clang 20.
  size:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.5@sha256:bc8ecad77f13664efd2c5961f3c82751d45b3c0b05fb3ccaaea9d0bdd0966f60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime builds
        run: |
          runtime() { # tree, then cmake arguments
            cmake -B "out/$1" -G Ninja -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_OFFLINE=OFF \
              -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_WERROR=ON "${@:2}"
            cmake --build "out/$1" -j 4
          }
          for level in O2 O3; do
            for simd in scalar auto; do
              runtime "size-$level-$simd" -DCMAKE_C_COMPILER=gcc-14 "-DCMAKE_C_FLAGS_RELEASE=-$level -DNDEBUG" \
                -D${PREFIX}_SIMD=$simd
            done
          done
          runtime size-clang -DCMAKE_C_COMPILER=clang-20
      - name: Text by part
        run: |
          for level in O2 O3; do
            echo "== -$level, scalar"
            python3 tools/size_report.py "out/size-$level-scalar/libmaul-anim.a" --check "$level"
            echo "== -$level, AVX2"
            python3 tools/size_report.py "out/size-$level-auto/libmaul-anim.a" --check "$level-avx2"
          done
      - name: Allocators under Clang
        run: python3 tools/size_report.py out/size-clang/libmaul-anim.a --allocators

  # The library and its tests under Emscripten and Node, and the static
  # library's size, reported. The CI image has no Emscripten, so this job
  # uses the runner and the emsdk action.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Configure
        run: cmake --preset web-emscripten
      - name: Build
        run: cmake --build --preset web-emscripten -j 4
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Size
        run: stat -c '%s bytes' out/web-emscripten/libmaul-anim.a
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # Each fuzz target runs over the bytes programs hand the library, from
  # the corpus the nightly run grows (restored from its cache, never saved
  # here) and the committed seeds in test/seeds: briefly on a pull request,
  # a minute on main.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.5@sha256:bc8ecad77f13664efd2c5961f3c82751d45b3c0b05fb3ccaaea9d0bdd0966f60
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz -j 4
      - name: Run
        run: tools/fuzz.sh out/linux-fuzz "$FUZZ_SECONDS"
      - name: Fuzz logs and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: |
            out/fuzz-logs/
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 7

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, windows, size, web, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
