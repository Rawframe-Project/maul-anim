# The ufbx differential (mani-0018): every file of ufbx's corpus, at the
# commit CMake pins, read by ufbx and by Maul Anim and compared, and the
# fixtures' expected values written again and held against the committed
# ones. The ACL differential (mani-0019): ozz-animation's Quaternius file
# at 0.17.0, its clips compressed by ACL and by Maul Anim, sizes, errors
# and times printed, every bone within the precision required. The ozz
# differential (mani-0020): the same clips sampled and blended, with
# masks and additive layers, by ozz's BlendingJob and by Maul Anim,
# compared to binary32 rounding and timed. The IK differential
# (mani-0029): random two-bone chains and aims solved by ozz's
# IKTwoBoneJob and IKAimJob and by Maul Anim. The retargeting
# differential (mani-0032): random poses of a humanoid retargeted to
# another by Godot 4.7.2's RetargetModifier3D, run headless, and by Maul
# Anim, the model rotations compared. Weekly and by hand, not on every
# commit: they fetch and build ufbx, ACL and ozz-animation, and fetch
# Godot.
name: differential

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  # apt retries a stalled download and gives up on a dead one.
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30

jobs:
  fbx:
    name: fbx-ufbx
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
      - name: Configure
        # The sanitizers watch the library through every file.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMAUL_ANIM_WERROR=ON \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DMAUL_ANIM_SANITIZE=ON -DMAUL_ANIM_DIFFERENTIAL=ON \
            -DMAUL_ANIM_BUILD_TESTS=OFF -DMAUL_ANIM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --target fbx_differential -j 4
      - name: ufbx's corpus
        run: |
          cd build/_deps/ufbx-src/data
          "$GITHUB_WORKSPACE/build/fbx_differential" \
            --deviations "$GITHUB_WORKSPACE/tools/fbx-deviations.txt" *.fbx
      - name: The fixtures' expected values
        if: ${{ !cancelled() }}
        run: |
          build/fbx_differential --deviations tools/fbx-deviations.txt \
            --expect build/fbx_fixture_expect.h test/data/fbx/*.fbx
          python3 tools/fbx_fixtures.py --compare build/fbx_fixture_expect.h test/fbx_fixture_expect.h

  acl:
    name: compression-acl
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 ninja-build
      - name: Configure
        # Release: the times are printed, and ACL is built as it ships.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAUL_ANIM_WERROR=ON \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DMAUL_ANIM_DIFFERENTIAL=ON -DMAUL_ANIM_BUILD_TESTS=OFF -DMAUL_ANIM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --target acl_differential -j 4
      - name: The Quaternius clips
        # ozz-animation 0.17.0's media, CC0 per its README; checked by hash.
        run: |
          curl -sSfL --retry 3 -o ual.fbx \
            https://raw.githubusercontent.com/guillaumeblanc/ozz-animation/744eb9d99f606eda849acb0b1204f7a3dc20bca1/media/fbx/quaternius/ual.fbx
          echo "42f16a4ed61d1e9f5fc7c2526894c5487148ac6ba82b64281ceb7943570f3c37  ual.fbx" | sha256sum -c -
          build/acl_differential ual.fbx

  ozz:
    name: blending-ozz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 ninja-build
      - name: Configure
        # Release: the times are printed, and ozz is built as it ships.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAUL_ANIM_WERROR=ON \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DMAUL_ANIM_DIFFERENTIAL=ON -DMAUL_ANIM_BUILD_TESTS=OFF -DMAUL_ANIM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --target ozz_differential -j 4
      - name: The Quaternius clips
        # The same file, from the ozz-animation commit CMake fetched.
        run: |
          f=build/_deps/ozz-src/media/fbx/quaternius/ual.fbx
          echo "42f16a4ed61d1e9f5fc7c2526894c5487148ac6ba82b64281ceb7943570f3c37  $f" | sha256sum -c -
          build/ozz_differential "$f"

  ik:
    name: ik-ozz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 ninja-build
      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAUL_ANIM_WERROR=ON \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DMAUL_ANIM_DIFFERENTIAL=ON -DMAUL_ANIM_BUILD_TESTS=OFF -DMAUL_ANIM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --target ik_differential -j 4
      - name: Random chains
        run: build/ik_differential 1000000

  retarget:
    name: retarget-godot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT: Godot_v4.7.2-stable_linux.x86_64
      # The release's SHA512-SUMS.txt entry for the zip.
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 ninja-build
      - name: Fetch Godot
        timeout-minutes: 10
        run: |
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          unzip -q godot.zip
      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAUL_ANIM_WERROR=ON \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DMAUL_ANIM_DIFFERENTIAL=ON -DMAUL_ANIM_BUILD_TESTS=OFF -DMAUL_ANIM_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --target retarget_godot -j 4
      - name: Random poses
        run: |
          mkdir -p godot-project
          printf 'config_version=5\n' > godot-project/project.godot
          cp tools/retarget_godot.gd godot-project/
          build/retarget_godot write "$PWD/in.txt" 500
          timeout 300 "./$GODOT" --headless --path godot-project --script retarget_godot.gd \
            -- "$PWD/in.txt" "$PWD/out.txt"
          build/retarget_godot check in.txt out.txt
